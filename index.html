<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#02060b">

    <title>Liked Songs</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- LEFT / SONG AREA -->

    <div class="music-area">

        <header class="header">

            <button class="back-button" id="backButton">
                ‹
            </button>

            <div class="page-title">
                Liked Songs
            </div>

        </header>


        <!-- TABS -->

        <div class="tabs">

            <button class="tab">
                Albums
            </button>

            <button class="tab active">
                Songs
            </button>

            <button class="tab">
                Playlists
            </button>

        </div>


        <!-- SONG LIST -->

        <div
            class="song-list"
            id="songList"
        ></div>

    </div>


    <!-- RIGHT VISUAL -->

    <div class="visual-area">

        <canvas
            id="eyeCanvas"
        ></canvas>


        <!-- BRAND / VISUAL TEXT -->

        <div class="visual-brand">

            <div class="code-icon">
                &lt;/&gt;
            </div>

            <div class="brand-title">
                LUMA<span>xDEV</span>
            </div>

            <div class="brand-subtitle">
                BUILDING DIGITAL FUTURES
            </div>

        </div>


        <!-- LYRICS -->

        <div
            class="lyrics"
            id="lyrics"
        >
            <span id="lyricText">
                Select a song
            </span>
        </div>


        <!-- PLAYER -->

        <div class="player">

            <button
                id="playButton"
                class="player-button"
            >
                ▶
            </button>

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar"
                ></div>

            </div>

            <button
                id="muteButton"
                class="player-button small"
            >
                🔊
            </button>

        </div>

    </div>


    <!-- AUDIO -->

    <audio
        id="audio"
        preload="metadata"
    ></audio>

</div>


<script src="script.js"></script>

</body>
</html>
